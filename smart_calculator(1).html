<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15352d"><title>Smart Calculator | स्मार्ट कैलकुलेटर</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#18352d;--muted:#64746e;--green:#15352d;--lime:#d6e9a8;--line:#dce5df;--accent:#e6f0d5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}header{background:var(--green);color:white;padding:22px 16px 20px;border-radius:0 0 24px 24px}header small{color:var(--lime);font-weight:700;letter-spacing:1px}header h1{margin:7px 0 4px;font-size:26px}header p{margin:0;color:#d6e4dc;font-size:14px}.wrap{max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;margin:2px 0 14px}.toolbar button,.tab,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.toolbar button{background:white;color:var(--green);border:1px solid var(--line)}.toolbar button.active,.btn{background:var(--green);color:white}.section-title{font-size:17px;margin:18px 2px 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tab{background:var(--card);color:var(--ink);text-align:left;border:1px solid var(--line);min-height:75px;font-size:14px}.tab span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}.tab.active{border:2px solid var(--green);background:var(--accent)}.panel{background:var(--card);padding:17px;border:1px solid var(--line);border-radius:18px;margin-top:12px;box-shadow:0 3px 12px #17382b0a}.panel h2{margin:0 0 5px;font-size:20px}.sub{color:var(--muted);font-size:13px;margin:0 0 15px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:10px;font:inherit;color:var(--ink);background:#fff}input:focus,select:focus{outline:2px solid #aac58e;border-color:transparent}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.btn.secondary{background:#e8eee9;color:var(--green)}.result{background:var(--green);color:white;padding:16px;border-radius:14px;margin-top:15px}.result small{color:#d6e4dc}.result strong{display:block;font-size:26px;margin:5px 0;overflow-wrap:anywhere}.result p{margin:5px 0 0;color:#d6e4dc;font-size:13px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 2px}.hidden{display:none}.calc-display{font-size:30px;text-align:right;background:#f6f8f6;padding:18px 12px;border-radius:12px;min-height:70px;overflow:auto;margin:10px 0}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{border:1px solid var(--line);background:#f4f7f4;color:var(--ink);padding:15px 4px;border-radius:10px;font-size:18px;font-weight:600}.keys button.op{background:#e5efda}.keys button.equal{background:var(--green);color:white}.keys button.wide{grid-column:span 2}.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px 8px}.pill{display:inline-block;background:#e8f0e4;color:#36583d;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}@media(max-width:430px){.fields{grid-template-columns:1fr}.tab{padding:10px;min-height:70px}.panel{padding:14px}header h1{font-size:24px}}
</style></head><body>
<header><div class="wrap" style="padding:0"><small>SMART TOOLS</small><h1>Smart Calculator</h1><p>स्मार्ट कैलकुलेटर · Hindi + English</p></div></header>
<main class="wrap"><div class="toolbar"><button id="hiBtn" class="active" onclick="setLang('hi')">हिंदी</button><button id="enBtn" onclick="setLang('en')">English</button></div>
<div class="section-title" id="chooseTitle">कैलकुलेटर चुनें / Choose a calculator</div><div class="grid" id="menu"></div><section class="panel" id="toolPanel"></section><p class="note" id="disclaimer">नोट: SIP/SWP के रिटर्न अनुमान हैं, गारंटी नहीं। परिणाम केवल जानकारी के लिए हैं, वित्तीय सलाह नहीं।</p><div class="footer">Smart Calculator · Made for easy everyday calculations</div></main>
<script>
let lang='hi',current='normal',expr='';const names={normal:['Normal Calculator','सामान्य कैलकुलेटर'],interest:['Interest Calculator','ब्याज कैलकुलेटर'],sip:['SIP Calculator','SIP निवेश कैलकुलेटर'],swp:['SWP Calculator','SWP निकासी कैलकुलेटर'],emi:['Loan EMI Calculator','लोन EMI कैलकुलेटर'],fd:['FD Calculator','FD कैलकुलेटर'],rd:['RD Calculator','RD कैलकुलेटर'],percent:['Percentage Calculator','प्रतिशत कैलकुलेटर'],discount:['Discount Calculator','डिस्काउंट कैलकुलेटर']};const desc={normal:['Basic maths','जोड़, घटाव, गुणा, भाग'],interest:['Simple & compound interest','साधारण और चक्रवृद्धि ब्याज'],sip:['Monthly investment estimate','मासिक निवेश का अनुमान'],swp:['Monthly withdrawal estimate','मासिक निकासी का अनुमान'],emi:['Monthly loan payment','मासिक लोन किस्त'],fd:['Fixed deposit maturity','FD की मैच्योरिटी'],rd:['Recurring deposit estimate','RD की अनुमानित रकम'],percent:['Find percentage','प्रतिशत निकालें'],discount:['Sale price and savings','छूट और अंतिम कीमत']};const money=n=>'₹'+(Number.isFinite(n)?n:0).toLocaleString('en-IN',{maximumFractionDigits:2});function tx(en,hi){return lang==='hi'?hi:en}function setLang(l){lang=l;document.getElementById('hiBtn').classList.toggle('active',l==='hi');document.getElementById('enBtn').classList.toggle('active',l==='en');renderMenu();renderTool()}
function renderMenu(){document.getElementById('menu').innerHTML=Object.keys(names).map(k=>`<button class="tab ${current===k?'active':''}" onclick="choose('${k}')">${names[k][lang==='hi'?1:0]}<span>${desc[k][lang==='hi'?1:0]}</span></button>`).join('')}
function choose(k){current=k;renderMenu();renderTool()}
function field(id,label,value=0,step='any'){return `<div><label for="${id}">${label}</label><input id="${id}" type="number" min="0" step="${step}" value="${value}" /></div>`}function selectField(id,label,opts){return `<div><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`}function panel(title,subtitle,fields,button,fn){document.getElementById('toolPanel').innerHTML=`<h2>${title}</h2><p class="sub">${subtitle}</p><div class="fields">${fields}</div><div class="actions"><button class="btn" onclick="${fn}">${button}</button><button class="btn secondary" onclick="renderTool()">${tx('Reset','रीसेट')}</button></div><div id="result"></div>`}function output(title,value,detail=''){document.getElementById('result').innerHTML=`<div class="result"><small>${title}</small><strong>${value}</strong>${detail?`<p>${detail}</p>`:''}</div>`}function val(id){return Math.max(0,Number(document.getElementById(id)?.value)||0)}function renderTool(){if(current==='normal'){document.getElementById('toolPanel').innerHTML=`<h2>${names.normal[lang==='hi'?1:0]}</h2><p class="sub">${desc.normal[lang==='hi'?1:0]}</p><div id="calcDisplay" class="calc-display">0</div><div class="keys">${[['C','clear'],['⌫','back'],['%','percent'],['÷','/'],['7','7'],['8','8'],['9','9'],['×','*'],['4','4'],['5','5'],['6','6'],['−','-'],['1','1'],['2','2'],['3','3'],['+','+'],['0','0','wide'],['.','.'],['=','=']].map(a=>`<button class="${['/','*','-','+','=','%'].includes(a[1])?'op ':''}${a[1]==='='?'equal ':''}${a[2]||''}" onclick="key('${a[1]}')">${a[0]}</button>`).join('')}</div>`;return}
let f='',title=names[current][lang==='hi'?1:0],sub=desc[current][lang==='hi'?1:0],btn=tx('Calculate','गणना करें'),fn='calculate()';switch(current){case'interest':f=field('principal',tx('Principal amount (₹)','मूलधन (₹)'),100000)+field('rate',tx('Annual interest rate (%)','सालाना ब्याज दर (%)'),7)+field('years',tx('Time (years)','समय (वर्ष)'),5)+selectField('kind',tx('Interest type','ब्याज का प्रकार'),[['simple',tx('Simple interest','साधारण ब्याज')],['compound',tx('Compound yearly','चक्रवृद्धि (सालाना)')]]);break;case'sip':f=field('monthly',tx('Monthly investment (₹)','मासिक निवेश (₹)'),5000)+field('rate',tx('Expected annual return (%)','अनुमानित सालाना रिटर्न (%)'),12)+field('years',tx('Investment period (years)','निवेश अवधि (वर्ष)'),10);break;case'swp':f=field('principal',tx('Starting amount (₹)','शुरुआती रकम (₹)'),1000000)+field('monthly',tx('Monthly withdrawal (₹)','मासिक निकासी (₹)'),10000)+field('rate',tx('Expected annual return (%)','अनुमानित सालाना रिटर्न (%)'),7)+field('years',tx('Duration (years)','अवधि (वर्ष)'),10);break;case'emi':f=field('principal',tx('Loan amount (₹)','लोन राशि (₹)'),500000)+field('rate',tx('Annual interest rate (%)','सालाना ब्याज दर (%)'),9)+field('years',tx('Loan period (years)','लोन अवधि (वर्ष)'),5);break;case'fd':f=field('principal',tx('Deposit amount (₹)','जमा राशि (₹)'),100000)+field('rate',tx('Annual interest rate (%)','सालाना ब्याज दर (%)'),7)+field('years',tx('Period (years)','अवधि (वर्ष)'),5)+selectField('compound',tx('Compounding','ब्याज जुड़ने की अवधि'),[['4',tx('Quarterly','तिमाही')],['1',tx('Yearly','सालाना')],['12',tx('Monthly','मासिक')]]);break;case'rd':f=field('monthly',tx('Monthly deposit (₹)','मासिक जमा (₹)'),2000)+field('rate',tx('Annual interest rate (%)','सालाना ब्याज दर (%)'),6.5)+field('years',tx('Period (years)','अवधि (वर्ष)'),5);break;case'percent':f=field('principal',tx('Number / total','संख्या / कुल'),200)+field('rate',tx('Percentage (%)','प्रतिशत (%)'),15);break;case'discount':f=field('principal',tx('Original price (₹)','मूल कीमत (₹)'),2000)+field('rate',tx('Discount (%)','छूट (%)'),20);break;}panel(title,sub,f,btn,fn)}
function calculate(){let p=val('principal'),r=val('rate')/100,y=val('years'),m=val('monthly'),n=Math.round(y*12),ans=0,detail='';switch(current){case'interest':if(document.getElementById('kind').value==='simple'){ans=p*r*y;detail=tx('Total amount: ','कुल रकम: ')+money(p+ans)}else{ans=p*Math.pow(1+r,y)-p;detail=tx('Total amount: ','कुल रकम: ')+money(p+ans)}output(tx('Interest earned','कुल ब्याज'),money(ans),detail);break;case'sip':{let rm=Math.pow(1+r,1/12)-1;ans=rm===0?m*n:m*(Math.pow(1+rm,n)-1)/rm;let invested=m*n;output(tx('Estimated future value','अनुमानित कुल रकम'),money(ans),tx('Invested: ','कुल निवेश: ')+money(invested)+' · '+tx('Estimated gain: ','अनुमानित लाभ: ')+money(ans-invested));break}case'swp':{let bal=p,months=0,rm=Math.pow(1+r,1/12)-1;while(bal>0&&months<n&&months<1200){bal=bal*(1+rm)-m;months++}let total=Math.min(months*m,p+Math.max(0,bal));output(tx('Estimated duration','अनुमानित अवधि'),Math.floor(months/12)+' '+tx('years','वर्ष')+' '+months%12+' '+tx('months','महीने'),tx('Total withdrawn (approx.): ','कुल निकासी (लगभग): ')+money(total)+(bal>0?' · '+tx('Balance after selected period: ','अवधि के बाद बची रकम: ')+money(bal):' · '+tx('Funds may run out within this period.','इस अवधि में पैसा समाप्त हो सकता है।')));break}case'emi':{let rr=r/12;ans=rr===0?p/n:p*rr*Math.pow(1+rr,n)/(Math.pow(1+rr,n)-1);output(tx('Monthly EMI','मासिक EMI'),money(ans),tx('Total repayment: ','कुल भुगतान: ')+money(ans*n)+' · '+tx('Total interest: ','कुल ब्याज: ')+money(ans*n-p));break}case'fd':{let c=Number(document.getElementById('compound').value),amt=p*Math.pow(1+r/c,c*y);output(tx('Maturity amount','मैच्योरिटी राशि'),money(amt),tx('Interest earned: ','कुल ब्याज: ')+money(amt-p));break}case'rd':{let rm=Math.pow(1+r,1/12)-1;ans=rm===0?m*n:m*(Math.pow(1+rm,n)-1)/rm;output(tx('Estimated maturity','अनुमानित मैच्योरिटी'),money(ans),tx('Total deposits: ','कुल जमा: ')+money(m*n)+' · '+tx('Estimated interest: ','अनुमानित ब्याज: ')+money(ans-m*n));break}case'percent':ans=p*r;output(tx('Result','परिणाम'),money(ans),val('rate')+'% '+tx('of','का')+' '+p+' = '+ans);break;case'discount':ans=p*r;output(tx('Final price','अंतिम कीमत'),money(p-ans),tx('You save: ','आपकी बचत: ')+money(ans));break}}
function key(k){let d=document.getElementById('calcDisplay');if(k==='clear'){expr='';d.textContent='0';return}if(k==='back'){expr=expr.slice(0,-1);d.textContent=expr||'0';return}if(k==='='){try{if(!/^[0-9+\-*/().% ]+$/.test(expr))throw 0;let e=expr.replace(/%/g,'/100');let res=Function('"use strict";return ('+e+')')();if(!Number.isFinite(res))throw 0;expr=String(Math.round(res*1e10)/1e10);d.textContent=expr}catch(e){d.textContent=tx('Invalid calculation','गलत गणना');expr=''}return}if(k==='percent')k='%';expr+=k;d.textContent=expr||'0'}
renderMenu();renderTool();
</script></body></html>
