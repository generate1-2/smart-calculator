<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Smart Calculator</title><meta name="description" content="Contact Smart Calculator for questions, feedback, suggestions or support related to our free online calculator tools.">
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 800px;
  margin: 30px auto;
  padding: 20px;
  line-height: 1.7;
  color: #222;
  background: #f7f7f7;
}
main {
  background: white;
  padding: 25px;
  border-radius: 12px;
}
select {
  padding: 10px;
  margin-bottom: 20px;
}
  form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

label {
  font-weight: bold;
  margin-top: 8px;
}

input, form select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  box-sizing: border-box;
  font-size: 16px;
  font-family: Arial, sans-serif;
}

textarea {
  resize: vertical;
}

button {
  background: #0759b5;
  color: white;
  padding: 13px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #06458c;
  }
</style>
</head>
<body>
<main>
<select id="language" onchange="changeLanguage()">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
</select>

<div id="english">
<h1>Contact Us</h1>
<p>We would love to hear from you. Please fill out the form below.</p>

<form action="#" method="post">
<label for="name">Your Name</label>
<input type="text" id="name" name="name" required>

<label for="email">Email Address</label>
<input type="email" id="email" name="email" required>

<label for="subject">Subject</label>
<select id="subject" name="subject" required>
<option value="Feedback">Feedback</option>
<option value="Question">Question</option>
<option value="Suggestion">Suggestion</option>
<option value="Problem">Report a Problem</option>
</select>

<label for="message">Your Message</label>
<textarea id="message" name="message" rows="5" required></textarea>

<button type="submit">Submit</button>
</form>
<div id="hindi" style="display:none">
<h1>संपर्क करें</h1>
<p>हमें आपसे सुनकर खुशी होगी। कृपया नीचे दिया गया फ़ॉर्म भरें।</p>

<form action="#" method="post">
<label for="name-hi">आपका नाम</label>
<input type="text" id="name-hi" name="name-hi" required>

<label for="email-hi">ईमेल पता</label>
<input type="email" id="email-hi" name="email-hi" required>

<label for="subject-hi">विषय चुनें</label>
<select id="subject-hi" name="subject-hi" required>
<option value="Feedback">सुझाव / प्रतिक्रिया</option>
<option value="Question">सवाल</option>
<option value="Suggestion">नया सुझाव</option>
<option value="Problem">समस्या की जानकारी</option>
</select>

<label for="message-hi">आपका संदेश</label>
<textarea id="message-hi" name="message-hi" rows="5" required></textarea>

<button type="submit">भेजें</button>
</form>
</div>

<p><a href="index.html">Home / मुख्य पेज</a></p>
</main>

<script>
function changeLanguage() {
  const lang = document.getElementById("language").value;
  document.getElementById("english").style.display =
    lang === "en" ? "block" : "none";
  document.getElementById("hindi").style.display =
    lang === "hi" ? "block" : "none";
}
</script>
</body>
</html>
